<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gōku, Tu amigo y asistente | Gōku Lab</title>
<meta name="description" content="Súper Agente Gōku - Asistente virtual de Gōku Lab. Consulta cursos, horarios, costos y más.">
<link rel="icon" type="image/png" href="/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul:        #00AEEF;
    --azul-oscuro: #0090C8;
    --amarillo:    #F5A800;
    --rojo:        #E63329;
    --verde:       #5CB85C;
    --blanco:      #FFFFFF;
    --gris-fondo:  #F4F7FB;
    --gris-borde:  #E2EAF4;
    --gris-texto:  #8899AA;
    --sombra:      0 2px 16px rgba(0,174,239,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--gris-fondo);
    font-family: 'Quicksand', sans-serif;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(0,174,239,0.07) 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(245,168,0,0.07) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .chat-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--blanco);
    box-shadow: var(--sombra);
    border-left: 1px solid var(--gris-borde);
    border-right: 1px solid var(--gris-borde);
  }

  /* ── HEADER ── */
  .header {
    padding: 14px 18px;
    background: var(--azul);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .header::after {
    content: '';
    position: absolute;
    right: -20px; top: -20px;
    width: 90px; height: 90px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }

  .header::before {
    content: '';
    position: absolute;
    right: 30px; bottom: -30px;
    width: 60px; height: 60px;
    background: rgba(245,168,0,0.15);
    border-radius: 50%;
  }

  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: relative;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-fallback { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; color: var(--azul); }

  .header-info { flex: 1; }

  .header-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 15px; color: white;
  }

  .header-status {
    font-size: 12px; color: rgba(255,255,255,0.85);
    margin-top: 1px; display: flex; align-items: center; gap: 4px;
  }

  .dot-verde {
    width: 7px; height: 7px;
    background: #7FE87F; border-radius: 50%; display: inline-block;
    animation: pulso 2s infinite;
  }

  @keyframes pulso {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .header-badge {
    font-family: 'Nunito', sans-serif;
    font-size: 10px; font-weight: 700;
    color: var(--azul); background: white;
    padding: 3px 8px; border-radius: 20px;
    position: relative; z-index: 1;
  }

  /* ── MENSAJES ── */
  .messages {
    flex: 1; overflow-y: auto;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-behavior: smooth;
    background: var(--gris-fondo);
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--gris-borde); border-radius: 2px; }

  .date-sep {
    text-align: center; font-size: 11px;
    color: var(--gris-texto); margin: 4px 0 8px;
    letter-spacing: 0.06em; font-weight: 600;
  }

  .msg {
    display: flex; flex-direction: column;
    max-width: 80%;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.88) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .msg.bot  { align-self: flex-start; }
  .msg.user { align-self: flex-end; }

  .msg.bot .msg-row {
    display: flex; align-items: flex-end; gap: 6px;
  }

  .bot-icon {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--azul);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }

  .bot-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .bot-icon-fallback { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 10px; color: white; }

  .bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.55;
    word-break: break-word; font-weight: 500;
  }

  .msg.bot .bubble {
    background: white; color: #2D3748;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--gris-borde);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .msg.user .bubble {
    background: var(--azul); color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,174,239,0.3);
  }

  .msg-time {
    font-size: 10px; color: var(--gris-texto);
    margin-top: 3px; padding: 0 4px; font-weight: 600;
  }

  .msg.user .msg-time { text-align: right; }

  /* Typing indicator */
  .typing {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 14px; background: white;
    border: 1px solid var(--gris-borde);
    border-radius: 18px; border-bottom-left-radius: 4px;
    width: fit-content;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    animation: bounce 1.2s infinite; opacity: 0.5;
  }

  .typing span:nth-child(1) { background: var(--azul); }
  .typing span:nth-child(2) { background: var(--amarillo); animation-delay: 0.2s; }
  .typing span:nth-child(3) { background: var(--verde); animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── SUGERENCIAS ── */
  .suggestions {
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: white;
    border-top: 1px solid var(--gris-borde);
  }

  .chip {
    white-space: nowrap; font-size: 12px;
    font-family: 'Quicksand', sans-serif; font-weight: 700;
    color: var(--azul); background: rgba(0,174,239,0.08);
    border: 1.5px solid rgba(0,174,239,0.25);
    padding: 6px 12px; border-radius: 20px;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }

  .chip:hover {
    background: var(--azul); color: white; border-color: var(--azul);
    transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,174,239,0.3);
  }

  /* ── INPUT ── */
  .input-area {
    padding: 10px 14px 14px; border-top: 1px solid var(--gris-borde);
    display: flex; gap: 10px; align-items: flex-end;
    background: white; flex-shrink: 0;
  }

  .input-box {
    flex: 1; background: var(--gris-fondo);
    border: 1.5px solid var(--gris-borde); border-radius: 22px;
    padding: 10px 16px; color: #2D3748;
    font-family: 'Quicksand', sans-serif; font-size: 14px; font-weight: 500;
    resize: none; outline: none; max-height: 100px; line-height: 1.4;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .input-box::placeholder { color: var(--gris-texto); }

  .input-box:focus {
    border-color: var(--azul); background: white;
    box-shadow: 0 0 0 3px rgba(0,174,239,0.12);
  }

  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--azul); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
    box-shadow: 0 3px 10px rgba(0,174,239,0.35);
  }

  .send-btn:hover  { background: var(--azul-oscuro); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { background: var(--gris-borde); cursor: not-allowed; box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* Toast */
  .toast {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--verde); color: white;
    padding: 8px 20px; border-radius: 20px;
    font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(92,184,92,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--rojo); box-shadow: 0 4px 16px rgba(230,51,41,0.4); }
</style>
</head>
<body>

<div class="chat-wrapper" id="chatWrapper">

  <!-- Header -->
  <div class="header">
    <div class="avatar" id="headerAvatar">
      <img src="/logo.png" alt="Gōku Lab" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'avatar-fallback\'>GL</span>'"/>
    </div>
    <div class="header-info">
      <div class="header-name">Súper Agente Gōku</div>
      <div class="header-status"><span class="dot-verde"></span> En línea</div>
    </div>
    <div class="header-badge">Do it!</div>
  </div>

  <!-- Mensajes -->
  <div class="messages" id="messages">
    <div class="date-sep">HOY</div>
    <div class="msg bot">
      <div class="msg-row">
        <div class="bot-icon">
          <img src="/logo.png" alt="GL" onerror="this.parentElement.innerHTML='<span class=&quot;bot-icon-fallback&quot;>GL</span>'"/>
        </div>
        <div class="bubble">
          ¡Hola! 👋 Soy <strong>Gōku</strong>. Puedo ayudarte con información sobre cursos, horarios, costos, ubicación y más. ¿En qué te puedo ayudar?
        </div>
      </div>
      <div class="msg-time" style="padding-left:34px">ahora</div>
    </div>
  </div>

  <!-- Sugerencias rápidas -->
  <div class="suggestions" id="suggestions">
    <div class="chip" onclick="sendSuggestion('¿Cuánto cuestan los cursos?')">💰 Costos</div>
    <div class="chip" onclick="sendSuggestion('¿Qué cursos tienen disponibles?')">📚 Cursos</div>
    <div class="chip" onclick="sendSuggestion('¿Qué horarios manejan?')">🕐 Horarios</div>
    <div class="chip" onclick="sendSuggestion('¿Dónde están ubicados?')">📍 Ubicación</div>
    <div class="chip" onclick="sendSuggestion('¿Dan certificado?')">🎓 Certificación</div>
    <div class="chip" onclick="sendSuggestion('¿Tienen clase de prueba?')">🎯 Clase demo</div>
    <div class="chip" onclick="sendSuggestion('¿Cuáles son las formas de pago?')">💳 Pagos</div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      class="input-box"
      id="msgInput"
      placeholder="Escribe tu pregunta..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

</div>

<!-- Toast de notificación -->
<div class="toast" id="toast"></div>

<script>
  // ── CONFIGURACIÓN ────────────────────────────────
  const API_URL = 'https://agentevirtual-gokulab.onrender.com';
  const USER_ID = 'web_' + Math.random().toString(36).substr(2, 8);
  const TIMEOUT_MS = 30000; // 30 segundos máximo
  let isSending = false;

  // Limpia URLs viejas cacheadas en el navegador
  try {
    localStorage.removeItem('gokulab_api_url');
  } catch (e) { /* localStorage no disponible, ignorar */ }

  // ── UTILIDADES ───────────────────────────────────
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function getTime() {
    return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── RENDERIZADO DE MENSAJES ──────────────────────
  function appendMsg(role, text) {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    if (role === 'bot') {
      const row = document.createElement('div');
      row.className = 'msg-row';

      const iconDiv = document.createElement('div');
      iconDiv.className = 'bot-icon';
      iconDiv.innerHTML = `<img src="/logo.png" alt="GL" onerror="this.parentElement.innerHTML='<span class=&quot;bot-icon-fallback&quot;>GL</span>'"/>`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(iconDiv);
      row.appendChild(bubble);
      wrap.appendChild(row);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.style.paddingLeft = '34px';
      time.textContent = getTime();
      wrap.appendChild(time);
    } else {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = getTime();
      wrap.appendChild(time);
    }

    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `
      <div class="msg-row">
        <div class="bot-icon">
          <img src="/logo.png" alt="GL" onerror="this.parentElement.innerHTML='<span class=&quot;bot-icon-fallback&quot;>GL</span>'"/>
        </div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ── ENVÍO DE MENSAJES ────────────────────────────
  async function sendMessage(text = null) {
    if (isSending) return;
    const input = document.getElementById('msgInput');
    const msg = text || input.value.trim();
    if (!msg) return;

    isSending = true;
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendMsg('user', msg);
    showTyping();

    // Timeout por si el servidor tarda demasiado (modelos de razonamiento)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: msg, numero: USER_ID }),
        signal: controller.signal,
      });

      clearTimeout(timeoutId);
      hideTyping();

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data && data.respuesta) {
        appendMsg('bot', data.respuesta);
      } else {
        appendMsg('bot', 'Recibí una respuesta vacía del servidor. Intenta de nuevo.');
      }
    } catch (err) {
      clearTimeout(timeoutId);
      hideTyping();

      let errorMsg = 'No pude conectarme al servidor. Intenta de nuevo en un momento.';
      if (err.name === 'AbortError') {
        errorMsg = 'La respuesta está tardando más de lo esperado. Por favor, intenta de nuevo.';
      } else if (err.message && err.message.includes('HTTP')) {
        errorMsg = `Error del servidor (${err.message}). Intenta de nuevo en un momento.`;
      }

      appendMsg('bot', errorMsg);
      showToast('Error de conexión', true);
      console.error('[Chat Error]', err);
    }

    isSending = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function sendSuggestion(text) {
    sendMessage(text);
  }

  // Auto-focus al cargar
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('msgInput').focus();
  });
</script>
